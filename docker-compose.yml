services:
  postgres:
    image: postgres:16-alpine
    container_name: agro-pass_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - agro-pass_pgdata:/var/lib/postgresql/data

volumes:
  agro-pass_pgdata: