name: agro-paass-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agro_pass_test
      POSTGRES_PASSWORD: agro_pass_test
      POSTGRES_DB: agro_pass_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro_pass_test -d agro_pass_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
