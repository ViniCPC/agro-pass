# Render Blueprint: API (Docker) + managed PostgreSQL + persistent disk for
# uploads, and the frontend as a static site.
#
# After the first deploy, fill the variables marked `sync: false` in the
# Render dashboard (they depend on the URLs Render generates), then redeploy.
databases:
  - name: agropass-db
    databaseName: agropass
    user: agropass
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    diskSizeGB: 5
    ipAllowList: []

services:
  - type: web
    name: agropass-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    # Persistent disks need a paid instance.
    plan: starter
    # Liveness only: a database outage must not trigger restarts.
    healthCheckPath: /health/live
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agropass-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Adds missing demo fixtures; existing data and passwords are preserved.
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: TRUST_PROXY
        value: "1"
      # Public frontend URL, written into QR codes. e.g. https://agropass-web.onrender.com
      - key: PUBLIC_APP_URL
        sync: false
      # Public API URL, written into cNFT metadata. e.g. https://agropass-api.onrender.com
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: BLOCKCHAIN_ENABLED
        value: "false"

  - type: web
    name: agropass-web
    runtime: static
    rootDir: frontend
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # e.g. https://agropass-api.onrender.com
      - key: VITE_API_URL
        sync: false
      # Same value as the API's PUBLIC_APP_URL.
      - key: VITE_PUBLIC_APP_URL
        sync: false
